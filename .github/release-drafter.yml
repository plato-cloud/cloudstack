name-template: 'Release $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
filter-by-commitish: true
categories:
  - title: 'Backports from upstream'
    labels: ['upstream', 'backport']
  - title: 'Fixes'
    labels: ['bug', 'fix']
  - title: 'Features'
    labels: ['feature', 'enhancement']
  - title: 'Maintenance'
    labels: ['chore', 'dependencies']
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '- No changes'
version-resolver:
  major:
    labels: ['breaking', 'major']
  minor:
    labels: ['feature', 'enhancement', 'minor']
  patch:
    labels: ['bug', 'fix', 'patch']
  default: patch
template: |
  Stable release built from `4.22` and published to apt channel `noble` at https://apt.platoform.net/.

  ## What's Changed

  $CHANGES
