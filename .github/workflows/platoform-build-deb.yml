name: Build and publish .deb packages

on:
  push:
    branches:
      - "4.22"
      - "4.22-testing"
  release:
    types: [published]

concurrency:
  group: platoform-build-deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Build runs on release publish (-> noble) and push to 4.22-testing
    # (-> noble-testing). Plain push to 4.22 only refreshes the release draft.
    if: github.event_name == 'release' || github.ref_name == '4.22-testing'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Fetch tags
        run: git fetch --tags --depth=100 origin

      - name: Set up JDK 17 for Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk-headless maven nodejs build-essential \
            dpkg-dev debhelper genisoimage lsb-release devscripts \
            python3-setuptools python3-mysql.connector

      - name: Determine build version
        id: ver
        # Bake the version from git so artifacts are reproducible and sortable.
        # Release events emit a clean prod version; testing pushes carry
        # -testing plus commits-ahead + SHA so every build is unique.
        # Brand is baked in here because build-deb.sh's --brand truncates
        # everything after the first dash in the POM version.
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            VER="${TAG#v}.0-platoform"
          else
            TAG=$(git tag --list 'v4.22.*' --sort=-version:refname | head -n1)
            TAG="${TAG:-v4.22.0}"
            BASE="${TAG#v}.0"
            SHA=$(git rev-parse --short=8 HEAD)
            if git merge-base --is-ancestor "$TAG" HEAD 2>/dev/null; then
              COUNT=$(git rev-list --count "$TAG..HEAD")
              if [ "$COUNT" -eq 0 ]; then
                VER="${BASE}-testing-platoform"
              else
                VER="${BASE}-testing-${COUNT}-g${SHA}-platoform"
              fi
            else
              VER="${BASE}-testing-g${SHA}-platoform"
            fi
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building version: $VER"

      - name: Pin POM version
        run: |
          VER='${{ steps.ver.outputs.version }}'
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          mvn versions:set -DnewVersion="$VER" \
            -P vmware,developer,systemvm,simulator -Dnoredist \
            versions:commit -B
          # tools/checkstyle/ is not in the reactor — bump it directly
          (cd tools/checkstyle && mvn versions:set -DnewVersion="$VER" versions:commit -B)
          # Non-POM version refs the reactor doesn't touch
          perl -pi -e "s/\Q$CURRENT\E/$VER/g" debian/changelog tools/marvin/setup.py

      - name: Build .deb packages
        env:
          ACS_BUILD_OPTS: -DskipTests=true
          NODE_OPTIONS: --openssl-legacy-provider
        run: ./packaging/build-deb.sh --output-directory dist

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudstack-debs
          path: dist/*.deb
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cloudstack-debs
          path: dist

      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "dist=noble" >> "$GITHUB_OUTPUT"
          else
            echo "dist=noble-testing" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PLATOFORM_APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          FPR=$(gpg --list-keys --with-colons admin@platoform.net | awk -F: '/^fpr/{print $10; exit}')
          echo "GPG_FINGERPRINT=$FPR" >> "$GITHUB_ENV"

      - name: Install deb-s3
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby
          sudo gem install deb-s3 --no-document

      - name: Publish to apt repo
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
        run: |
          deb-s3 upload \
            --bucket=platoform-apt \
            --codename=${{ steps.channel.outputs.dist }} \
            --component=main \
            --sign=$GPG_FINGERPRINT \
            --arch=amd64 \
            --visibility=private \
            dist/*.deb

      - name: Invalidate CloudFront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-2
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/dists/${{ steps.channel.outputs.dist }}/*"

  # Runs independently of build/publish: pushes to 4.22 only refresh the
  # release draft. Publishing the draft (release: published event above)
  # is what actually triggers the build + apt publish to noble.
  release-draft:
    if: github.event_name == 'push' && github.ref_name == '4.22'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          commitish: 4.22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
